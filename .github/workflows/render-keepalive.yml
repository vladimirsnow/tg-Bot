name: Keep Render service awake

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake and check Render health endpoint
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          set -eu
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "Set the repository Actions variable RENDER_SERVICE_URL to the public Render service URL."
            exit 1
          fi

          health_url="${RENDER_SERVICE_URL%/}/health"
          attempt=1
          while [ "$attempt" -le 18 ]; do
            response="$(curl --fail --silent --show-error --max-time 8 "$health_url" 2>/dev/null || true)"
            if [ "$response" = "ok" ]; then
              echo "Render health check succeeded."
              exit 0
            fi
            echo "Render is starting; retry $attempt/18."
            attempt=$((attempt + 1))
            sleep 5
          done

          echo "Render health endpoint did not return ok within 90 seconds."
          exit 1
